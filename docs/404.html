    <script>
      // Enforce trailing slash on GitHub Pages so relative asset paths './assets/...' resolve properly
      (function() {
        if (window.location.hostname.includes('github.io')) {
          var pathname = window.location.pathname;
          if (!pathname.endsWith('/') && !pathname.endsWith('.html')) {
            window.location.replace(pathname + '/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>

    <script>
      // Fallback if /src/main.tsx cannot be transpiled by server (e.g. deployed raw from repo root to GitHub Pages)
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('main.tsx')) {
          console.warn('Vite dev server not running. Loading compiled production bundle.');
          var fallbackScript = document.createElement('script');
          fallbackScript.type = 'module';
          fallbackScript.crossOrigin = '';
          fallbackScript.src = './assets/index.js';
          document.body.appendChild(fallbackScript);
        }
      }, true);
    </script>
